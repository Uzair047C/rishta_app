name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.24.3'

jobs:
  # Backend: typecheck, lint, tests with Postgres
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rishta
          POSTGRES_PASSWORD: rishta
          POSTGRES_DB: rishta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rishta -d rishta_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U rishta -d rishta_test; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres not ready after 30s" && exit 1

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://rishta:rishta@localhost:5432/rishta_test
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        env:
          DATABASE_URL: postgresql://rishta:rishta@localhost:5432/rishta_test
          JWT_SECRET: test-secret-min-32-chars-long
          FIREBASE_PROJECT_ID: test-project
          FIREBASE_CLIENT_EMAIL: test@test-project.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDtest\n-----END PRIVATE KEY-----\n"
          STREAM_API_KEY: test-key
          STREAM_API_SECRET: test-secret
        run: npm test

  # Frontend: analyze, test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # Optional: Build checks
  build-android:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK (debug)
        run: flutter build apk --debug --no-tree-shake-icons

  build-ios:
    needs: frontend
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign