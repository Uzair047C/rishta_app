name: rishta
description: Rishta matchmaking app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Auth / storage / push
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.1
  google_sign_in: ^6.2.2

  # Chat
  stream_chat_flutter: ^9.0.0

  # Media capture. `camera` (not image_picker) is what makes the selfie step
  # in-app-only — see features/onboarding/selfie_screen.dart.
  camera: ^0.11.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2

  # Networking / formatting / UI polish
  http: ^1.3.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
